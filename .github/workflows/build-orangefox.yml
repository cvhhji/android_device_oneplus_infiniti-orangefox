name: Build OrangeFox infiniti

on:
  push:
    branches:
      - fox_16.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      FOX_ROOT: /home/runner/android/fox_16.0
      FOX_OUT: /home/runner/android/fox_16.0/out

    steps:
      - name: Check out device tree
        uses: actions/checkout@v7

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev libgl1-mesa-dev libncurses-dev libssl-dev \
            libxml2 libxml2-utils lz4 lzop openjdk-17-jdk pngcrush python3 \
            python-is-python3 rsync schedtool squashfs-tools unzip xsltproc zip zlib1g-dev

      - name: Install Repo and sync OrangeFox sources
        run: |
          mkdir -p "$HOME/bin" "$(dirname "$FOX_ROOT")"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"
          git clone --depth=1 https://github.com/OrangeFox16/sync.git "$RUNNER_TEMP/orangefox-sync"
          cd "$RUNNER_TEMP/orangefox-sync"
          "$RUNNER_TEMP/orangefox-sync/orangefox_sync.sh" --branch 16.0 --path "$FOX_ROOT"

      - name: Overlay device tree and patch recovery defaults
        run: |
          mkdir -p "$FOX_ROOT/device/oneplus/infiniti"
          rsync -a --delete --exclude='.git/' --exclude='.github/' \
            "$GITHUB_WORKSPACE/" "$FOX_ROOT/device/oneplus/infiniti/"
          python3 "$GITHUB_WORKSPACE/tools/patch_orangefox_splash.py" \
            "$FOX_ROOT/bootable/recovery"

      - name: Add temporary swap space for Soong
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          swapon --show
          df -h /

      - name: Build recovery image
        run: |
          cd "$FOX_ROOT"
          export PATH="$HOME/bin:$PATH"
          export FOX_VERSION=R11.3_fox_16.0
          export FOX_BUILD_TYPE=Alpha
          export FOX_BUILD_DEVICE=infiniti
          export ALLOW_MISSING_DEPENDENCIES=true
          export OUT_DIR="$FOX_ROOT/out"
          allowlist_file=vendor/google/build/androidmk/allowlist.txt
          mkdir -p "$(dirname "$allowlist_file")"
          touch "$allowlist_file"
          if ! grep -Fqx "external/magisk-prebuilt/Android.mk" "$allowlist_file"; then
            printf '%s\n' "external/magisk-prebuilt/Android.mk" >> "$allowlist_file"
          fi
          echo "Soong Android.mk allowlist entry:"
          grep -F "external/magisk-prebuilt/Android.mk" "$allowlist_file"
          mkdir -p "$OUT_DIR/.module_paths"
          {
            for tree in device vendor product; do
              if [ -d "$tree" ]; then
                find "$tree" -type f -name AndroidProducts.mk -print
              fi
            done
          } | sort -u > "$OUT_DIR/.module_paths/AndroidProducts.mk.list"
          if ! grep -Fqx "device/oneplus/infiniti/AndroidProducts.mk" \
            "$OUT_DIR/.module_paths/AndroidProducts.mk.list"; then
            echo "infiniti AndroidProducts.mk was not added to the product inventory" >&2
            exit 1
          fi
          source build/envsetup.sh
          export OUT_DIR="$FOX_ROOT/out"
          echo "Resolved source root: $(gettop)"
          echo "Resolved output directory: $(getoutdir)"
          echo "AndroidProducts.mk contents:"
          cat device/oneplus/infiniti/AndroidProducts.mk
          echo "Direct product parser probe for twrp_infiniti/bp2a/eng:"
          set +e
          TARGET_PRODUCT=twrp_infiniti TARGET_RELEASE=bp2a TARGET_BUILD_VARIANT=eng \
            build/soong/soong_ui.bash --dumpvar-mode TARGET_DEVICE \
            > "$RUNNER_TEMP/infiniti-product-probe.log" 2>&1
          product_probe_status=$?
          set -e
          cat "$RUNNER_TEMP/infiniti-product-probe.log"
          echo "Direct product parser exit status: $product_probe_status"
          if [ "$product_probe_status" -ne 0 ]; then
            echo "AOSP control parser probe for aosp_arm64/trunk_staging/eng:"
            set +e
            TARGET_PRODUCT=aosp_arm64 TARGET_RELEASE=trunk_staging TARGET_BUILD_VARIANT=eng \
              build/soong/soong_ui.bash --dumpvar-mode TARGET_DEVICE \
              > "$RUNNER_TEMP/aosp-product-probe.log" 2>&1
            aosp_probe_status=$?
            set -e
            cat "$RUNNER_TEMP/aosp-product-probe.log"
            echo "AOSP control parser exit status: $aosp_probe_status"
            echo "Generated build logs after product parser failure:"
            while IFS= read -r -d '' log_file; do
              echo "--- $log_file ---"
              tail -n 80 "$log_file"
            done < <(find "$OUT_DIR" -maxdepth 4 -type f -iname '*.log' -print0)
          fi
          echo "Available products:"
          set +e
          products=$(list_products)
          products_status=$?
          set -e
          echo "list_products exit status: $products_status"
          printf '%s\n' "$products"
          echo "infiniti product inventory entry:"
          grep -F "device/oneplus/infiniti/AndroidProducts.mk" \
            "$OUT_DIR/.module_paths/AndroidProducts.mk.list" || true
          echo "Available releases for twrp_infiniti:"
          list_releases twrp_infiniti || true
          echo "Available releases for aosp_arm64:"
          list_releases aosp_arm64 || true
          set +e
          lunch twrp_infiniti bp2a eng
          lunch_status=$?
          set -e
          if [ "$lunch_status" -ne 0 ]; then
            echo "lunch failed with status: $lunch_status"
            echo "Generated build logs after lunch failure:"
            while IFS= read -r -d '' log_file; do
              echo "--- $log_file ---"
              tail -n 120 "$log_file"
            done < <(find "$OUT_DIR" -maxdepth 4 -type f -iname '*.log' -print0)
            exit "$lunch_status"
          fi
          mka adbd recoveryimage &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            sleep 60
            if kill -0 "$build_pid" 2>/dev/null; then
              echo "Recovery build is still active at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              ps -eo pid,ppid,stat,etime,%cpu,%mem,rss,comm --sort=-%cpu | head -n 12
              free -h
              df -h "$FOX_ROOT"
            fi
          done
          wait "$build_pid"

      - name: Remove temporary swap space
        if: success()
        run: |
          sudo swapoff /swapfile
          sudo rm /swapfile

      - name: Stage recovery artifact
        run: |
          recovery_image=$(find "$FOX_OUT" -type f -name recovery.img -print -quit)
          if [ -z "$recovery_image" ]; then
            echo "recovery.img was not produced under $FOX_OUT" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/orangefox-infiniti-artifact"
          bash "$GITHUB_WORKSPACE/tools/transplant_avb.sh" \
            "$GITHUB_WORKSPACE/avb/recovery-vbmeta.bin" \
            "$recovery_image" \
            "$RUNNER_TEMP/orangefox-infiniti-artifact/OrangeFox-infiniti-Android17-recovery.img"
          stat "$RUNNER_TEMP/orangefox-infiniti-artifact/OrangeFox-infiniti-Android17-recovery.img"
          sha256sum "$RUNNER_TEMP/orangefox-infiniti-artifact/OrangeFox-infiniti-Android17-recovery.img" \
            > "$RUNNER_TEMP/orangefox-infiniti-artifact/SHA256SUMS"

      - name: Upload recovery image
        uses: actions/upload-artifact@v7
        with:
          name: OrangeFox-infiniti-Android17-${{ github.sha }}
          path: ${{ runner.temp }}/orangefox-infiniti-artifact/
          if-no-files-found: error
          retention-days: 14
